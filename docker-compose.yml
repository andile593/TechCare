version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: techcare
      POSTGRES_PASSWORD: techcare
      POSTGRES_DB: techcare_dev
    ports:
      - "5432:5432"
    volumes:
      - techcare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techcare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  techcare_pgdata:
